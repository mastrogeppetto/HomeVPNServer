server {
    listen 80; # Ascolta sulla porta 80 standard
    listen [::]:80;
    server_name jellyfin.ciuffo.org; # Il nome di dominio che risolverai con il DNS

# Se un utente accede alla root del dominio (es. jellyfin.lan/)
    location = / {
        # Esegue un reindirizzamento temporaneo (302) al path di login
        # Usa 301 per un reindirizzamento permanente (più adatto per SEO, meno per cambiamenti frequenti)
        return 302 /web/#/login.html;
    }

    location / {
        proxy_pass http://192.168.113.38:8096; # Inoltra la richiesta all'IP e alla porta reali di Jellyfin
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Aggiungi altre intestazioni se necessarie per Jellyfin (ad es. per WebSocket)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s; # Ad esempio, per streaming lunghi
    }
}
