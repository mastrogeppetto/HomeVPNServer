server {
    listen 80; # Nginx ascolta sulla porta HTTP standard
    listen [::]:80;
    server_name home.ciuffo.org; # Il nome di dominio che risolverai con il DNS

    # Specifica la directory radice per i file del tuo sito web
    root /usr/share/nginx/html; # Questo è il percorso *all'interno del container Nginx*

    # Specifica i file indice predefiniti (es. index.html quando si accede a una directory)
    index index.html index.htm;

    location = /favicon.ico {
        alias /usr/share/nginx/favicon-home.ico; # Percorso completo al file dentro il container
#        log_not_found off; # Non loggare gli errori se la favicon non viene trovata
        access_log off;    # Non loggare gli accessi per la favicon
        expires 30d;       # Imposta una cache per 30 giorni (opzionale)
    }

    # Configurazione per la gestione dei file
    location / {
        try_files $uri $uri/ =404; # Cerca il file richiesto, poi la directory, altrimenti restituisci 404
    }

    # Opzionale: Configurazione per file di errore personalizzati (es. per pagina 404)
    # error_page 404 /404.html;
    # location = /404.html {
    #     internal;
    # }

    # Opzionale: Blocca l'accesso a file nascosti (.git, .env, ecc.)
    location ~ /\. {
        deny all;
    }

    # Opzionale: Aggiungi intestazioni di sicurezza (buona pratica)
    # add_header X-Frame-Options "SAMEORIGIN";
    # add_header X-XSS-Protection "1; mode=block";
    # add_header X-Content-Type-Options "nosniff";
    # add_header Referrer-Policy "no-referrer-when-downgrade";
    # add_header Content-Security-Policy "default-src 'self'";
}
