services:
  nginx:
    image: nginx:1.28.0-alpine
    hostname: nginx
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro  # Configurazione principale Nginx
      - ./nginx/conf.d/:/etc/nginx/conf.d/:ro        # Configurazione dei singoli siti
      # Se userai SSL (Let's Encrypt o certificati personali):
      # - /opt/nginx/ssl/:/etc/nginx/ssl/:ro # Directory per i certificati SSL
      # - ./templates:/etc/nginx/templates
      - ./site:/usr/share/nginx/html:ro # Pagina di benvenuto
    ports:
      - "80:80"   # Espone la porta HTTP standard sull'host
      - "443:443" # Espone la porta HTTPS standard (se userai SSL)
    environment:
    - NGINX_HOST=foobar.com
    - NGINX_PORT=80
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.28.5.100

  wg-easy:
    image: weejewel/wg-easy
    hostname: wg-easy
    container_name: wg-easy
    environment:
      - WG_HOST=5cvm118.duckdns.org
      - PASSWORD=asterix
      - WG_DEFAULT_DNS=172.28.5.102
      - WG_ALLOWED_IPS=10.8.0.0/24,172.28.5.0/24,192.168.113.0/24
    volumes:
      - ./wg-easy-data:/etc/wireguard
    ports:      
      - "51821:51821/tcp"
      - "51820:51820/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.28.5.101

  dns:
    image: strm/dnsmasq
    hostname: dns
    container_name: dns
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf
    ports:
      - "53:53/udp"
    cap_add:
      - NET_ADMIN
    restart: always
    networks:
      default:
        ipv4_address: 172.28.5.102

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          ip_range: 172.28.5.0/24
          gateway: 172.28.5.1
