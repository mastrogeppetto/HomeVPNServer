services:
  web:
    image: nginx:1.28.0-alpine
    hostname: nginx
    container_name: nginx
    volumes:
#    - ./templates:/etc/nginx/templates
#    - ./nginx/nginx.conf:/etc/nginx/nginx.conf
#    - ./nginx/conf.d:/etc/nginx/conf.d
    - ./site:/usr/share/nginx/html:ro
    ports:
    - "80:80"
    environment:
    - NGINX_HOST=foobar.com
    - NGINX_PORT=80
    networks:
      default:
        ipv4_address: 172.28.5.100

  wg-easy:
    image: weejewel/wg-easy
    hostname: wg-easy
    container_name: wg-easy
    environment:
      - WG_HOST=5cvm118.duckdns.org
      - PASSWORD=asterix
      - WG_DEFAULT_DNS=172.28.5.102
    volumes:
      - ./wg-easy-data:/etc/wireguard
    ports:      
      - "51821:51821/tcp"
      - "51820:51820/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.28.5.101

  dns:
    image: pihole/pihole:latest
    hostname: dns
    container_name: dns
    networks:
      default:
        ipv4_address: 172.28.5.102 # L'IP statico per Pi-hole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80"
    environment:
      PUID: 1000 # forse inutile (sarebbe PIHOLE_UID)
      PGID: 1000 # idem
      TZ: "Europe/Rome"
    volumes:
      - ./pihole/:/etc/pihole/
      - ./dnsmasq.d/:/etc/dnsmasq.d/
    restart: unless-stopped

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          ip_range: 172.28.5.0/24
          gateway: 172.28.5.1
